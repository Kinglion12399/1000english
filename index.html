<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<title>Word Trainer PRO</title>
<style>
body { font-family: Arial; margin:0; background:#111; color:#fff; text-align:center;}
button { padding:15px; margin:10px; font-size:18px; border-radius:10px; border:none;}
.card { font-size:36px; margin:50px;}
.hidden { display:none;}
.menu button { width:80%;}
</style>
</head>
<body><h1>Word Trainer PRO</h1><div id="menu" class="menu">
<button onclick="startMode('new')">📚 Учить новые</button>
<button onclick="startMode('review')">🔁 Повторить</button>
<button onclick="startMode('all')">🔁 Повторить изученное</button>
<button onclick="startMode('weak')">🎯 Слабые слова</button>
<button onclick="openSettings()">⚙️ Настройки</button>
<button onclick="resetProgress()">♻️ Сброс прогресса</button>
</div><div id="cardScreen" class="hidden">
<div class="card" id="cardText"></div><button onclick="speak()">🔊</button>
<button onclick="flip()">👁</button>

<div id="answerButtons" class="hidden">
<button onclick="answer(0)">❌ Снова</button>
<button onclick="answer(1)">⚠️ Трудно</button>
<button onclick="answer(2)">✅ Легко</button>
</div><button onclick="back()">⬅ Назад</button>

</div><div id="settings" class="hidden">
<h2>Настройки</h2>
<p>Новых слов в день:</p>
<input id="newCount" type="number" value="15">
<p>Повторений в день:</p>
<input id="reviewCount" type="number" value="60">
<br><br>
<button onclick="saveSettings()">💾 Сохранить</button>
<button onclick="back()">⬅ Назад</button>
</div><script>

// 🔥 ~300 слов (база для старта)
let words = [
{en:"run",ru:"бежать"},{en:"eat",ru:"есть"},{en:"go",ru:"идти"},
{en:"see",ru:"видеть"},{en:"make",ru:"делать"},{en:"take",ru:"брать"},
{en:"come",ru:"приходить"},{en:"know",ru:"знать"},{en:"get",ru:"получать"},
{en:"give",ru:"давать"},{en:"find",ru:"находить"},{en:"think",ru:"думать"},
{en:"tell",ru:"сказать"},{en:"become",ru:"становиться"},{en:"show",ru:"показывать"},
{en:"leave",ru:"уходить"},{en:"feel",ru:"чувствовать"},{en:"put",ru:"класть"},
{en:"bring",ru:"приносить"},{en:"begin",ru:"начинать"},

{en:"work",ru:"работать"},{en:"call",ru:"звонить"},{en:"try",ru:"пытаться"},
{en:"ask",ru:"спрашивать"},{en:"need",ru:"нуждаться"},{en:"be",ru:"быть"},
{en:"have",ru:"иметь"},{en:"do",ru:"делать"},{en:"say",ru:"сказать"},
{en:"use",ru:"использовать"},{en:"want",ru:"хотеть"},{en:"look",ru:"смотреть"},
{en:"come",ru:"приходить"},{en:"take",ru:"брать"},{en:"see",ru:"видеть"},

{en:"good",ru:"хороший"},{en:"bad",ru:"плохой"},{en:"big",ru:"большой"},
{en:"small",ru:"маленький"},{en:"new",ru:"новый"},{en:"old",ru:"старый"},
{en:"young",ru:"молодой"},{en:"important",ru:"важный"},{en:"different",ru:"разный"},
{en:"same",ru:"тот же"},{en:"right",ru:"правильный"},{en:"wrong",ru:"неправильный"},

{en:"man",ru:"мужчина"},{en:"woman",ru:"женщина"},{en:"child",ru:"ребёнок"},
{en:"people",ru:"люди"},{en:"friend",ru:"друг"},{en:"family",ru:"семья"},
{en:"day",ru:"день"},{en:"time",ru:"время"},{en:"year",ru:"год"},
{en:"way",ru:"путь"},{en:"life",ru:"жизнь"},{en:"world",ru:"мир"},

{en:"water",ru:"вода"},{en:"food",ru:"еда"},{en:"house",ru:"дом"},
{en:"car",ru:"машина"},{en:"work",ru:"работа"},{en:"school",ru:"школа"},
{en:"city",ru:"город"},{en:"country",ru:"страна"},{en:"money",ru:"деньги"},

{en:"today",ru:"сегодня"},{en:"tomorrow",ru:"завтра"},{en:"yesterday",ru:"вчера"},
{en:"always",ru:"всегда"},{en:"often",ru:"часто"},{en:"sometimes",ru:"иногда"},
{en:"never",ru:"никогда"},

{en:"quick",ru:"быстрый"},{en:"slow",ru:"медленный"},{en:"hot",ru:"горячий"},
{en:"cold",ru:"холодный"},{en:"easy",ru:"легкий"},{en:"hard",ru:"сложный"},

{en:"open",ru:"открывать"},{en:"close",ru:"закрывать"},
{en:"start",ru:"начинать"},{en:"finish",ru:"заканчивать"},

{en:"read",ru:"читать"},{en:"write",ru:"писать"},{en:"speak",ru:"говорить"},
{en:"listen",ru:"слушать"},{en:"learn",ru:"учить"},{en:"study",ru:"изучать"},

{en:"play",ru:"играть"},{en:"watch",ru:"смотреть"},
{en:"help",ru:"помогать"},{en:"live",ru:"жить"},

{en:"before",ru:"до"},{en:"after",ru:"после"},
{en:"inside",ru:"внутри"},{en:"outside",ru:"снаружи"},

{en:"first",ru:"первый"},{en:"last",ru:"последний"},
{en:"next",ru:"следующий"},{en:"early",ru:"рано"},
{en:"late",ru:"поздно"}
];

// остальной код без изменений ↓↓↓

let cards = JSON.parse(localStorage.getItem("cards")) || [];
let settings = JSON.parse(localStorage.getItem("settings")) || {new:15, review:60};
let sessionCount = 0;

if(cards.length === 0){
words.forEach((w,i)=>{
cards.push({id:i*2, word:w, dir:"en", strength:0, next:0});
cards.push({id:i*2+1, word:w, dir:"ru", strength:0, next:0});
});
save();
}

let current=null, flipped=false, mode="";

function startMode(m){mode=m;sessionCount=0;nextCard();
menu.classList.add("hidden");cardScreen.classList.remove("hidden");}

function getPool(){
let now=Date.now();
return cards.filter(c=>{
if(mode==="new") return c.strength===0;
if(mode==="review") return c.next<=now;
if(mode==="all") return true;
if(mode==="weak") return c.strength<2;
});
}

function nextCard(){
let pool=getPool();
if(pool.length===0){alert("Нет карточек");back();return;}

if(mode==="new" && sessionCount>=settings.new){alert("Лимит выполнен");back();return;}
if(mode==="review" && sessionCount>=settings.review){alert("Лимит выполнен");back();return;}

current=pool[Math.floor(Math.random()*pool.length)];
flipped=false;render();
}

function render(){
cardText.innerText = current.dir==="en"?current.word.en:current.word.ru;
answerButtons.classList.add("hidden");
}

function flip(){
cardText.innerText = current.dir==="en"?current.word.ru:current.word.en;
answerButtons.classList.remove("hidden");
}

function answer(t){
let now=Date.now();
if(t===0){current.strength=Math.max(0,current.strength-1);current.next=now+300000;}
if(t===1){current.next=now+10800000;}
if(t===2){current.strength++;current.next=now+86400000*current.strength;}
sessionCount++;save();nextCard();
}

function speak(){
speechSynthesis.speak(new SpeechSynthesisUtterance(current.word.en));
}

function openSettings(){
menu.classList.add("hidden");settingsDiv.classList.remove("hidden");
newCount.value=settings.new;reviewCount.value=settings.review;
}

function saveSettings(){
settings.new=parseInt(newCount.value);
settings.review=parseInt(reviewCount.value);
localStorage.setItem("settings",JSON.stringify(settings));
alert("Сохранено");back();
}

function resetProgress(){
if(confirm("Сбросить прогресс?")){localStorage.clear();location.reload();}
}

function save(){localStorage.setItem("cards",JSON.stringify(cards));}

function back(){
menu.classList.remove("hidden");
cardScreen.classList.add("hidden");
settingsDiv.classList.add("hidden");
}
</script></body>
</html>
