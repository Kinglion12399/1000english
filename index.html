<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English 1000</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:12px;color:#333;padding-bottom:80px}
    .container{max-width:500px;margin:0 auto}
    .header{background:white;border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
    .header h1{color:#667eea;font-size:22px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
    .stat{background:white;border-radius:12px;padding:10px 6px;text-align:center}
    .stat-v{font-size:20px;font-weight:bold;color:#667eea}
    .stat-l{font-size:10px;color:#666;margin-top:2px}
    .card{background:white;border-radius:16px;padding:24px;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-bottom:12px}
    .word{font-size:32px;font-weight:700;margin-bottom:12px;text-align:center}
    .trans{font-size:22px;color:#667eea;margin:12px 0;text-align:center;display:none}
    .ex{font-size:15px;color:#666;font-style:italic;text-align:center;margin-top:12px;padding:12px;background:#f5f5f5;border-radius:8px;display:none;width:100%}
    .empty{text-align:center;padding:40px 20px;color:#666}
    .btn{padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
    .btn-show{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
    .btn-again{background:#f44336;color:white}
    .btn-hard{background:#ff9800;color:white}
    .btn-good{background:#4CAF50;color:white}
    .btn-easy{background:#9C27B0;color:white}
    .btn-danger{background:#f44336;color:white}
    .grades{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;width:100%}
    .grades.show{display:grid}
    .controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .control-btn{padding:10px 14px;border:none;border-radius:10px;font-size:13px;cursor:pointer;background:white}
    .control-btn.active{background:#667eea;color:white}
    .session-info{background:rgba(255,255,255,.9);border-radius:8px;padding:8px 12px;margin-bottom:12px;text-align:center;font-size:13px}
    .menu{position:fixed;top:12px;right:12px;background:white;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
    .debug{position:fixed;bottom:100px;right:12px;background:#f44336;color:white;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -2px 10px rgba(0,0,0,.1);padding:8px 12px;display:flex;justify-content:space-around}
    .nav-item{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border:none;background:none;cursor:pointer;color:#999;font-size:11px}
    .nav-item.active{color:#667eea}
    .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .filter{padding:8px 14px;border:none;border-radius:20px;font-size:12px;cursor:pointer;background:white}
    .filter.active{background:#667eea;color:white}
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-end}
    .modal.show{display:flex}
    .modal-c{background:white;border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:80vh;overflow-y:auto}
    .setting{margin-bottom:16px}
    .setting-l{font-size:14px;color:#666;margin-bottom:6px}
    .setting-i{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px}
    .close{background:#667eea;color:white;border:none;padding:14px;border-radius:12px;font-size:16px;width:100%;margin-top:8px}
    .danger{background:#f44336;color:white;border:none;padding:14px;border-radius:12px;font-size:16px;width:100%;margin-top:12px}    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 24px;border-radius:24px;opacity:0;transition:opacity.3s}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <button class="menu" onclick="openMenu()">⚙️</button>
  <button class="debug" onclick="hardReset()" title="Полный сброс">🔄</button>
  
  <div class="container">
    <div class="header"><h1>🇬 English 1000</h1></div>
    
    <div class="stats">
      <div class="stat"><div class="stat-v" id="newC">0</div><div class="stat-l">Новых</div></div>
      <div class="stat"><div class="stat-v" id="learnC">0</div><div class="stat-l">Обучение</div></div>
      <div class="stat"><div class="stat-v" id="reviewC">0</div><div class="stat-l">Повтор</div></div>
      <div class="stat"><div class="stat-v" id="doneC">0</div><div class="stat-l">Выучено</div></div>
    </div>
    
    <div class="session-info" id="sessionInfo">Загрузка...</div>
    
    <div class="controls">
      <button class="control-btn active" onclick="setDir('en-ru',this)">EN→RU</button>
      <button class="control-btn" onclick="setDir('ru-en',this)">RU→EN</button>
      <button class="control-btn" onclick="setDir('random',this)">🎲</button>
      <button class="control-btn" onclick="speak()">🔊</button>
    </div>
    
    <div class="card">
      <div class="empty" id="emptyState">
        <div style="font-size:64px;margin-bottom:16px">🎉</div>
        <h2>Отлично!</h2>
        <p>Все слова изучены</p>
        <button class="btn btn-danger" onclick="hardReset()" style="margin-top:16px">🔄 Начать заново</button>
      </div>
      <div id="cardContent" style="display:none;width:100%">
        <div class="word" id="wordText"></div>
        <div class="trans" id="transText"></div>
        <div class="ex" id="exText"></div>
      </div>
    </div>
    
    <button class="btn btn-show" id="showBtn" onclick="showAnswer()">👁️ Показать ответ</button>
    <div class="grades" id="gradeBtns">
      <button class="btn btn-again" onclick="grade('again')">🔴 Снова</button>
      <button class="btn btn-hard" onclick="grade('hard')">🟠 Трудно</button>
      <button class="btn btn-good" onclick="grade('good')">🟢 Хорошо</button>
      <button class="btn btn-easy" onclick="grade('easy')">🟣 Легко</button>
    </div>
    
    <div id="reviewTab" style="display:none">      <div class="filters">
        <button class="filter active" onclick="setFilter('all',this)">Все</button>
        <button class="filter" onclick="setFilter('problem',this)">⚠️ Проблемные</button>
        <button class="filter" onclick="setFilter('random',this)">🎲 Случайные</button>
      </div>
      <button class="btn btn-show" onclick="startReview()">▶️ Начать</button>
    </div>
  </div>
  
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('learn',this)"><div>📚</div><div>Учить</div></button>
    <button class="nav-item" onclick="switchTab('review',this)"><div>🔁</div><div>Повторить</div></button>
    <button class="nav-item" onclick="showStats()"><div>📊</div><div>Статистика</div></button>
  </div>
  
  <div class="modal" id="settingsModal">
    <div class="modal-c">
      <h3 style="text-align:center;margin-bottom:16px">⚙️ Настройки</h3>
      <div class="setting"><div class="setting-l">Новых слов в день:</div><input type="number" class="setting-i" id="newPerDay" value="10"></div>
      <button class="close" onclick="saveSettings()">💾 Сохранить</button>
      <button class="btn" style="background:#f5f5f5" onclick="exportData()">📤 Экспорт</button>
      <button class="btn" style="background:#f5f5f5" onclick="document.getElementById('importFile').click()">📥 Импорт</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="danger" onclick="hardReset()">🗑️ Полный сброс</button>
      <button class="close" onclick="closeMenu()" style="background:#999;margin-top:8px">✖️</button>
    </div>
  </div>
  
  <div class="modal" id="statsModal">
    <div class="modal-c">
      <h3 style="text-align:center;margin-bottom:16px">📊 Статистика</h3>
      <div id="statsContent"></div>
      <button class="close" onclick="closeStats()">✖️ Закрыть</button>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

    let settings = { newPerDay: 10 };
    let state = { words: [], queue: [], lastDay: null, dir: 'en-ru', tab: 'learn' };
    let current = null;

    function init() {
      console.log('Init started, words in DB:', WORDS.length);      load();
      
      if (!state.words || state.words.length === 0) {
        console.log('No words in state, initializing...');
        state.words = WORDS.map((w, i) => ({
          id: i, en: w[0], ru: w[1], ex: w[2],
          status: 'new', step: 0, next: 0, ease: 2.5,
          reps: 0, lapses: 0, created: Date.now(),
          lastReview: 0, totalReviews: 0, correctCount: 0
        }));
        console.log('Created', state.words.length, 'words');
        save();
      }
      
      checkDay();
      prepare();
      updateStats();
      showCard();
      console.log('Init complete. Queue:', state.queue.length);
    }

    function load() {
      try {
        const s = localStorage.getItem('e1k_final');
        if (s) {
          const p = JSON.parse(s);
          if (p.state) state = { ...state, ...p.state };
          if (p.settings) settings = { ...settings, ...p.settings };
        }
      } catch(e) { console.error('Load error:', e); }
    }

    function save() {
      try {
        localStorage.setItem('e1k_final', JSON.stringify({ state, settings }));
      } catch(e) { console.error('Save error:', e); }
    }

    function checkDay() {
      const today = new Date().toDateString();
      if (state.lastDay !== today) {
        state.lastDay = today;
      }
    }

    function prepare() {
      const now = Date.now();
      state.queue = [];
      
      const due = state.words.filter(w => w.next <= now && w.status !== 'new' && w.status !== 'done');      state.queue.push(...due);
      
      const newToday = state.words.filter(w => w.status === 'learning' && w.created > new Date(state.lastDay).getTime()).length;
      const newWords = state.words.filter(w => w.status === 'new').slice(0, settings.newPerDay - newToday);
      state.queue.push(...newWords);
      
      state.queue.sort((a, b) => {
        const p = { learning: 1, review: 2, new: 3 };
        return p[a.status] - p[b.status];
      });
    }

    function showCard() {
      const empty = document.getElementById('emptyState');
      const content = document.getElementById('cardContent');
      const showBtn = document.getElementById('showBtn');
      const grades = document.getElementById('gradeBtns');
      const queue = state.tab === 'learn' ? state.queue : [];

      if (!queue.length) {
        empty.style.display = 'block';
        content.style.display = 'none';
        showBtn.style.display = 'none';
        grades.classList.remove('show');
        document.getElementById('sessionInfo').textContent = 'На сегодня всё! 🎉';
        return;
      }

      empty.style.display = 'none';
      content.style.display = 'block';
      showBtn.style.display = 'block';
      grades.classList.remove('show');

      current = queue[0];
      const dir = state.dir === 'random' ? (Math.random() > 0.5 ? 'en-ru' : 'ru-en') : state.dir;
      
      if (dir === 'en-ru') {
        document.getElementById('wordText').textContent = current.en;
        document.getElementById('transText').textContent = current.ru;
      } else {
        document.getElementById('wordText').textContent = current.ru;
        document.getElementById('transText').textContent = current.en;
      }
      document.getElementById('exText').textContent = current.ex;
      document.getElementById('transText').style.display = 'none';
      document.getElementById('exText').style.display = 'none';
      
      document.getElementById('sessionInfo').textContent = `В очереди: ${queue.length} слов`;
    }
    function showAnswer() {
      document.getElementById('transText').style.display = 'block';
      document.getElementById('exText').style.display = 'block';
      document.getElementById('showBtn').style.display = 'none';
      document.getElementById('gradeBtns').classList.add('show');
    }

    function grade(g) {
  const now = Date.now();
  
  if (current.status === 'new') { 
    current.status = 'learning'; 
    current.step = 0; 
    current.created = now;
  }
  
  current.totalReviews++;
  current.lastReview = now;
  
  const intervals = {
    again: 60000,
    hard: 600000,
    good: 86400000,
    easy: 259200000
  };
  
  if (g === 'again') { 
    current.lapses++; 
    current.step = 0;
    current.ease = Math.max(1.3, current.ease - 0.2);
    current.next = now + intervals.again;
    
    const idx = state.queue.indexOf(current);
    if (idx > -1) state.queue.splice(idx, 1);
    state.queue.push(current);
    
    showToast('Слово вернётся скоро 🔁');
  }
  else if (g === 'hard') { 
    current.step = Math.min(current.step + 1, 3);
    current.ease = Math.max(1.3, current.ease - 0.15);
    current.next = now + intervals.hard;
    
    const idx = state.queue.indexOf(current);
    if (idx > -1) state.queue.splice(idx, 1);
    state.queue.push(current);
    
    showToast('Ещё повторим 📚');
  }
  else if (g === 'good') { 
    current.correctCount++;
    
    if (current.status === 'learning') {
      current.step++;  // ← Исправлено: на отдельной строке
      
      if (current.step >= 4) {
        current.status = 'review';
        current.reps = 1;
      }
      current.next = now + intervals.good;
    }
    else if (current.status === 'review') {
      current.reps++;
      current.next = now + Math.round(intervals.good * current.ease);
      
      if (current.reps >= 10) {
        current.status = 'done';
      }
    }
    
    state.queue.shift();
    showToast(current.status === 'done' ? 'Выучено! ✅' : 'Хорошо! 👍');
  }
  else if (g === 'easy') { 
    current.correctCount++;
    current.ease += 0.15;
    
    if (current.status === 'learning') {
      current.status = 'review';
      current.reps = 1;
    }
    else if (current.status === 'review') {
      current.reps += 2;
      if (current.reps >= 10) {
        current.status = 'done';
      }
    }
    
    current.next = now + intervals.easy;
    state.queue.shift();
    showToast(current.status === 'done' ? 'Выучено! ✅' : 'Легко! 🎯');
  }
  
  save();
  updateStats();
  showCard();
}  // ← ВОТ ЭТА СКОБКА БЫЛА ПРОПУЩЕНА!

    function updateStats() {
      document.getElementById('newC').textContent = state.words.filter(w => w.status === 'new').length;
      document.getElementById('learnC').textContent = state.words.filter(w => w.status === 'learning').length;
      document.getElementById('reviewC').textContent = state.words.filter(w => w.status === 'review').length;
      document.getElementById('doneC').textContent = state.words.filter(w => w.status === 'done').length;
    }

    function setDir(d, btn) {
      state.dir = d;
      document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (current) showCard();
    }

    function speak() {
      if (!current) return;
      const u = new SpeechSynthesisUtterance(current.en);
      u.lang = 'en-US';
      speechSynthesis.speak(u);
    }

    function switchTab(t, btn) {
      state.tab = t;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));      btn.classList.add('active');
      
      document.getElementById('reviewTab').style.display = t === 'review' ? 'block' : 'none';
      if (t === 'learn') { prepare(); showCard(); }
    }

    function setFilter(f, btn) {
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startReview() {
      const words = state.words.filter(w => w.status !== 'new').sort(() => Math.random() - 0.5).slice(0, 20);
      state.queue = words;
      state.tab = 'learn';
      document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', i === 0));
      document.getElementById('reviewTab').style.display = 'none';
      showCard();
    }

    function openMenu() {
      document.getElementById('newPerDay').value = settings.newPerDay;
      document.getElementById('settingsModal').classList.add('show');
    }

    function closeMenu() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    function saveSettings() {
      settings.newPerDay = +document.getElementById('newPerDay').value || 10;
      save();
      closeMenu();
      prepare();
      showCard();
      showToast('Сохранено! ✅');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify({ state, settings })], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'english1000.json';
      a.click();
      showToast('Экспортировано! 📤');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          state = data.state || state;
          settings = data.settings || settings;
          save();
          location.reload();
        } catch(err) { showToast('Ошибка! ❌'); }
      };
      reader.readAsText(file);
    }

    function hardReset() {
      if (confirm('🔄 Сбросить ВСЁ и начать заново?')) {
        localStorage.removeItem('e1k_final');
        location.reload();
      }
    }

    function showStats() {
      const total = state.words.length;
      const done = state.words.filter(w => w.status === 'done').length;
      document.getElementById('statsContent').innerHTML = `
        <div style="text-align:center;padding:20px">
          <div style="font-size:48px;margin-bottom:10px">📊</div>
          <div>Всего слов: <b>${total}</b></div>
          <div>Выучено: <b>${done}</b></div>
          <div>Прогресс: <b>${Math.round(done/total*100)}%</b></div>
        </div>
      `;
      document.getElementById('statsModal').classList.add('show');
    }

    function closeStats() {
      document.getElementById('statsModal').classList.remove('show');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('settingsModal').addEventListener('click', e => { if (e.target.id === 'settingsModal') closeMenu(); });
    document.getElementById('statsModal').addEventListener('click', e => { if (e.target.id === 'statsModal') closeStats(); });

    window.addEventListener('load', init);
  </script></body>
