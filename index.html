<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LinguaFlow — Учи английский</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #f1f5f9;
    }

    /* Modern Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 90px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo span {
      font-size: 14px;
      font-weight: 400;
      background: none;
      color: #94a3b8;
      -webkit-background-clip: unset;
    }
    .settings-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .settings-btn:hover {
      background: rgba(59,130,246,0.2);
      border-color: #3b82f6;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid #334155;
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: #1e293b;
      padding: 4px;
      border-radius: 60px;
    }
    .tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
    }

    /* Flashcard */
    .flashcard-container {
      perspective: 1000px;
      margin-bottom: 24px;
    }
    .flashcard {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-radius: 32px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .flashcard:hover {
      transform: translateY(-4px);
      border-color: #3b82f6;
      box-shadow: 0 24px 48px rgba(59,130,246,0.2);
    }
    .card-word {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    .card-translation {
      font-size: 28px;
      color: #94a3b8;
      margin-top: 16px;
    }
    .card-example {
      font-size: 14px;
      color: #64748b;
      font-style: italic;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }
    .card-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      font-size: 12px;
      color: #475569;
    }
    .speak-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(59,130,246,0.2);
      border: none;
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .speak-btn:hover {
      background: rgba(59,130,246,0.4);
    }

    /* Rating Buttons */
    .rating-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .rating-btn {
      padding: 14px;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rating-btn:hover {
      transform: translateY(-2px);
    }
    .again { background: #ef4444; color: white; }
    .hard { background: #f59e0b; color: white; }
    .good { background: #10b981; color: white; }
    .easy { background: #8b5cf6; color: white; }

    /* Word List */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .search-input {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 40px;
      color: white;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
    }
    .word-item {
      background: #1e293b;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      border: 1px solid #334155;
    }
    .word-item:hover {
      border-color: #3b82f6;
      transform: translateX(4px);
    }
    .word-info {
      flex: 1;
    }
    .word-en {
      font-weight: 700;
      font-size: 16px;
    }
    .word-ru {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .word-status {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #334155;
      margin-left: 12px;
    }
    .status-new { background: #f59e0b20; color: #f59e0b; }
    .status-learning { background: #3b82f620; color: #60a5fa; }
    .status-done { background: #10b98120; color: #10b981; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 32px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      border: 1px solid #334155;
    }
    .modal-content h3 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    .setting-row {
      margin-bottom: 20px;
    }
    .setting-row label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 14px;
    }
    .setting-row input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: 14px;
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .modal-btn-danger {
      background: #ef4444;
      color: white;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 14px;
      z-index: 1100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      border: 1px solid #3b82f6;
    }
    .toast.show {
      opacity: 1;
    }

    /* Session Info */
    .session-info {
      text-align: center;
      padding: 12px;
      background: #1e293b;
      border-radius: 60px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* Hide elements */
    .hidden {
      display: none;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-in {
      animation: slideIn 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">LinguaFlow <span>· учи слова</span></div>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-value" id="statNew">0</div><div class="stat-label">Новые</div></div>
      <div class="stat-card"><div class="stat-value" id="statLearning">0</div><div class="stat-label">В процессе</div></div>
      <div class="stat-card"><div class="stat-value" id="statReview">0</div><div class="stat-label">К повтору</div></div>
      <div class="stat-card"><div class="stat-value" id="statDone">0</div><div class="stat-label">Выучено</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('learn')">📚 Учить</button>
      <button class="tab" onclick="switchTab('words')">📖 Словарь</button>
    </div>

    <div id="learnTab">
      <div class="session-info" id="sessionInfo">Готов к обучению ✨</div>
      
      <div id="emptyState" class="empty-state">
        <div class="empty-state-icon">🎉</div>
        <h3>Отлично!</h3>
        <p>Все слова изучены</p>
        <button onclick="resetAll()" style="margin-top: 16px; background: #3b82f6; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer;">🔄 Начать заново</button>
      </div>

      <div id="cardContainer" class="hidden">
        <div class="flashcard-container">
          <div class="flashcard" onclick="showAnswer()">
            <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊</button>
            <div class="card-word" id="cardWord"></div>
            <div id="cardTranslation" class="card-translation hidden"></div>
            <div id="cardExample" class="card-example hidden"></div>
            <div class="card-hint">👆 Нажми, чтобы увидеть перевод</div>
          </div>
        </div>
        <div id="ratingButtons" class="rating-buttons hidden">
          <button class="rating-btn again" onclick="rateCard('again')">🔄 Снова</button>
          <button class="rating-btn hard" onclick="rateCard('hard')">⚠️ Трудно</button>
          <button class="rating-btn good" onclick="rateCard('good')">✅ Хорошо</button>
          <button class="rating-btn easy" onclick="rateCard('easy')">⭐ Легко</button>
        </div>
      </div>
    </div>

    <div id="wordsTab" class="hidden">
      <div class="list-header">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск слов..." oninput="filterWords()">
      </div>
      <div id="wordsList"></div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ Настройки</h3>
      <div class="setting-row">
        <label>Новых слов в день:</label>
        <input type="number" id="newPerDay" min="1" max="50" value="10">
      </div>
      <div class="setting-row">
        <label>Направление:</label>
        <select id="direction" style="width:100%; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:12px; color:white;">
          <option value="en-ru">Английский → Русский</option>
          <option value="ru-en">Русский → Английский</option>
          <option value="random">🎲 Случайное</option>
        </select>
      </div>
      <button class="modal-btn modal-btn-primary" onclick="saveSettings()">💾 Сохранить</button>
      <button class="modal-btn modal-btn-danger" onclick="resetAll()">🗑️ Полный сброс</button>
      <button class="modal-btn" onclick="closeSettings()" style="background:#334155;">✖️ Закрыть</button>
    </div>
  </div>

  <div class="toast" id="toast">✨ Сохранено</div>

          correctStreak: 0
        }));
        saveData();
      }
      prepareQueue();
      updateStats();
      renderUI();
    }

    // Загрузка данных
    function loadData() {
      try {
        const saved = localStorage.getItem('linguaflow');
        if (saved) {
          const data = JSON.parse(saved);
          words = data.words || [];
          settings = data.settings || settings;
        }
      } catch(e) {}
    }

    // Сохранение данных
    function saveData() {
      try {
        localStorage.setItem('linguaflow', JSON.stringify({ words, settings }));
      } catch(e) {}
    }

    // Подготовка очереди
    function prepareQueue() {
      const now = Date.now();
      queue = [];
      
      // Слова для повторения
      const due = words.filter(w => w.status === 'learning' && w.nextReview <= now);
      queue.push(...due);
      
      // Новые слова
      const newToday = words.filter(w => w.status === 'learning' && w.nextReview > now - 86400000).length;
      const newWords = words.filter(w => w.status === 'new').slice(0, settings.newPerDay - newToday);
      queue.push(...newWords);
      
      queue.sort(() => Math.random() - 0.5);
    }

    // Обновление статистики
    function updateStats() {
      document.getElementById('statNew').textContent = words.filter(w => w.status === 'new').length;
      document.getElementById('statLearning').textContent = words.filter(w => w.status === 'learning').length;
      document.getElementById('statReview').textContent = words.filter(w => w.status === 'learning' && w.nextReview <= Date.now()).length;
      document.getElementById('statDone').textContent = words.filter(w => w.status === 'done').length;
    }

    // Показать следующую карточку
    function showNextCard() {
      if (queue.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('cardContainer').classList.add('hidden');
        document.getElementById('sessionInfo').textContent = 'На сегодня всё! 🎉 Отличная работа!';
        return;
      }
      
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('cardContainer').classList.remove('hidden');
      document.getElementById('ratingButtons').classList.add('hidden');
      document.getElementById('cardTranslation').classList.add('hidden');
      document.getElementById('cardExample').classList.add('hidden');
      
      currentCard = queue[0];
      showingAnswer = false;
      
      let wordText, translationText;
      const dir = settings.direction === 'random' ? (Math.random() > 0.5 ? 'en-ru' : 'ru-en') : settings.direction;
      
      if (dir === 'en-ru') {
        wordText = currentCard.en;
        translationText = currentCard.ru;
      } else {
        wordText = currentCard.ru;
        translationText = currentCard.en;
      }
      
      document.getElementById('cardWord').textContent = wordText;
      document.getElementById('cardTranslation').textContent = translationText;
      document.getElementById('cardExample').textContent = currentCard.example;
      
      document.getElementById('sessionInfo').textContent = `📚 В очереди: ${queue.length} слов`;
    }

    // Показать ответ
    function showAnswer() {
      if (showingAnswer) return;
      showingAnswer = true;
      document.getElementById('cardTranslation').classList.remove('hidden');
      document.getElementById('cardExample').classList.remove('hidden');
      document.getElementById('ratingButtons').classList.remove('hidden');
    }

    // Оценка карточки
    function rateCard(rating) {
      if (!currentCard) return;
      
      const now = Date.now();
      const wordIndex = words.findIndex(w => w.id === currentCard.id);
      
      if (wordIndex !== -1) {
        if (words[wordIndex].status === 'new') {
          words[wordIndex].status = 'learning';
        }
        
        // Интервалы повторения (в миллисекундах)
        const intervals = {
          again: 5 * 60 * 1000,      // 5 минут
          hard: 30 * 60 * 1000,      // 30 минут
          good: 24 * 60 * 60 * 1000,  // 1 день
          easy: 3 * 24 * 60 * 60 * 1000 // 3 дня
        };
        
        words[wordIndex].nextReview = now + intervals[rating];
        words[wordIndex].reviews++;
        
        if (rating === 'good' || rating === 'easy') {
          words[wordIndex].correctStreak++;
          if (words[wordIndex].correctStreak >= 5) {
            words[wordIndex].status = 'done';
          }
        } else {
          words[wordIndex].correctStreak = 0;
        }
      }
      
      queue.shift();
      saveData();
      updateStats();
      showNextCard();
    }

    // Озвучивание
    function speakWord() {
      if (!currentCard) return;
      const utterance = new SpeechSynthesisUtterance(currentCard.en);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    // Переключение вкладок
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        if ((tab === 'learn' && i === 0) || (tab === 'words' && i === 1)) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
      
      if (tab === 'learn') {
        document.getElementById('learnTab').classList.remove('hidden');
        document.getElementById('wordsTab').classList.add('hidden');
        prepareQueue();
        showNextCard();
      } else {
        document.getElementById('learnTab').classList.add('hidden');
        document.getElementById('wordsTab').classList.remove('hidden');
        renderWordsList();
      }
    }

    // Отображение списка слов
    function renderWordsList() {
      const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const filtered = words.filter(w => 
        w.en.toLowerCase().includes(searchTerm) || 
        w.ru.toLowerCase().includes(searchTerm)
      );
      
      const container = document.getElementById('wordsList');
      container.innerHTML = filtered.map(w => `
        <div class="word-item">
          <div class="word-info">
            <div class="word-en">${w.en}</div>
            <div class="word-ru">${w.ru}</div>
            <div style="font-size: 11px; color: #64748b; margin-top: 4px;">${w.example || ''}</div>
          </div>
          <div class="word-status status-${w.status}">${w.status === 'new' ? '📘 Новое' : w.status === 'learning' ? '📖 Учится' : '✅ Выучено'}</div>
        </div>
      `).join('');
    }

    // Фильтр слов
    function filterWords() {
      renderWordsList();
    }

    // Открыть настройки
    function openSettings() {
      document.getElementById('newPerDay').value = settings.newPerDay;
      document.getElementById('direction').value = settings.direction;
      document.getElementById('settingsModal').classList.add('show');
    }

    // Закрыть настройки
    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('show');
    }

    // Сохранить настройки
    function saveSettings() {
      settings.newPerDay = parseInt(document.getElementById('newPerDay').value) || 10;
      settings.direction = document.getElementById('direction').value;
      saveData();
      prepareQueue();
      showNextCard();
      closeSettings();
      showToast('Настройки сохранены! ✨');
    }

    // Полный сброс
    function resetAll() {
      if (confirm('⚠️ Вы уверены? Весь прогресс будет потерян!')) {
        localStorage.removeItem('linguaflow');
        location.reload();
      }
    }

    // Toast уведомление
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Рендер UI
    function renderUI() {
      updateStats();
      if (currentTab === 'learn') {
        showNextCard();
      } else {
        renderWordsList();
      }
    }

    // Экспорт функций в глобальную область
    window.switchTab = switchTab;
    window.showAnswer = showAnswer;
    window.rateCard = rateCard;
    window.speakWord = speakWord;
    window.openSettings = openSettings;
    window.closeSettings = closeSettings;
    window.saveSettings = saveSettings;
    window.resetAll = resetAll;
    window.filterWords = filterWords;

    // Запуск
    init();
  </script>
</body>
</html>
