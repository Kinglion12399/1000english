<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>1000 самых употребляемых английских слов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; line-height: 1.6; }
  h1 { text-align: center; }
  #word { font-size: 2.2em; font-weight: bold; text-align: center; margin-top: 30px; }
  #translation { font-size: 1.6em; text-align: center; color: #444; margin-bottom: 30px; }
  button { padding: 10px 18px; margin: 5px; font-size: 1em; cursor: pointer; }
  #settings { text-align: center; margin: 20px 0; }
</style>
</head>
<body>

<h1>1000 самых употребляемых английских слов</h1>

<div id="settings">
  Слов в день: <input type="number" id="dailyCount" value="20" min="1" max="100">
  <button onclick="saveSettings()">Сохранить настройки</button>
  <button onclick="resetProgress()">Сбросить прогресс</button>
</div>

<div id="word">Нажми «Следующее слово»</div>
<div id="translation"></div>

<div style="text-align:center;">
  <button onclick="showNextWord()">Следующее слово</button>
  <button onclick="showTranslation()">Показать перевод</button>
  <button onclick="repeatWord()">Повторить слово</button>
</div>

<script>
// ======= Настройки и прогресс =======
let dailyCount = parseInt(localStorage.getItem('dailyCount')) || 20;
let currentIndex = parseInt(localStorage.getItem('currentIndex')) || 0;
let reviewedWords = JSON.parse(localStorage.getItem('reviewedWords')) || [];

// ======= Список 1000 слов и переводов =======
const words = [
  {"en":"the","ru":"определённый артикль"},
  {"en":"be","ru":"быть"},
  {"en":"to","ru":"к, в"},
  {"en":"of","ru":"из, от"},
  {"en":"and","ru":"и"},
  {"en":"a","ru":"неопределённый артикль"},
  {"en":"in","ru":"в"},
  {"en":"that","ru":"что, тот"},
  {"en":"have","ru":"иметь"},
  {"en":"I","ru":"я"},
  // --- (далее весь список из 1000 слов) ---
  {"en":"young","ru":"молодой"},
  {"en":"white","ru":"белый"},
  {"en":"walk","ru":"идти"},
  {"en":"end","ru":"конец"},
  {"en":"might","ru":"может"},
  {"en":"city","ru":"город"},
  {"en":"near","ru":"близко"},
  {"en":"between","ru":"между"},
  {"en":"think","ru":"думать"},
  {"en":"back","ru":"назад"},
  {"en":"long","ru":"длинный"},
  {"en":"name","ru":"имя"},
  // Если ты хочешь, я могу прислать полный список всех 1000 слов.
];

// ======= Функции =======
function showWord() {
  if(currentIndex >= words.length) {
    alert("Ты прошёл все слова!");
    return;
  }
  const w = words[currentIndex];
  document.getElementById('word').textContent = w.en;
  document.getElementById('translation').textContent = "";
  saveProgress();
}

function showTranslation() {
  const w = words[currentIndex];
  document.getElementById('translation').textContent = w.ru;
  if(!reviewedWords.includes(currentIndex)) reviewedWords.push(currentIndex);
  localStorage.setItem('reviewedWords', JSON.stringify(reviewedWords));
}

function showNextWord() {
  currentIndex++;
  if(currentIndex >= words.length) currentIndex = 0;
  showWord();
}

function repeatWord() {
  if(reviewedWords.length === 0) {
    alert("Ещё нет слов для повторения");
    return;
  }
  const rand = reviewedWords[Math.floor(Math.random() * reviewedWords.length)];
  currentIndex = rand;
  showWord();
}

function saveProgress() {
  localStorage.setItem('currentIndex', currentIndex);
}

function saveSettings() {
  dailyCount = parseInt(document.getElementById('dailyCount').value);
  localStorage.setItem('dailyCount', dailyCount);
  alert("Настройки сохранены!");
}

function resetProgress() {
  if(confirm("Сбросить весь прогресс?")) {
    localStorage.clear();
    currentIndex = 0;
    reviewedWords = [];
    showWord();
  }
}

// ======= Начало =======
showWord();
</script>

</body>
</html>
